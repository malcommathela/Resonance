# ============================================================================
# Resonance Platform — L06 Cloud & Compute + L08 Security
# ============================================================================
# USAGE:
#   docker compose up -d api worker redis
#
# SECURITY NOTES:
#   • Never commit credentials in this file. Use .env or Docker secrets.
#   • Redis port is NOT exposed to host in production.
#   • Supabase connection string goes in apps/api/.env (DATABASE_URL).
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # REDIS — Queue + Pub/Sub + Rate Limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: resonance-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    # L08: Do NOT expose ports in production. Uncomment for local dev only.
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    networks:
      - resonance

  # ---------------------------------------------------------------------------
  # API SERVER — L06: HTTP request handler
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resonance-api
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT:-1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - resonance

  # ---------------------------------------------------------------------------
  # SIMULATION WORKER — L06: Background job processor
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resonance-worker
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      APP_MODE: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_MAX_MEMORY_MB: ${WORKER_MAX_MEMORY_MB:-2048}
      WORKER_MAX_EXECUTION_MS: ${WORKER_MAX_EXECUTION_MS:-300000}
      WORKER_HEALTH_PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["worker"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2G}
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - resonance

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  redis_data:
    driver: local

# ============================================================================
# NETWORKS — L08: Isolated bridge network
# ============================================================================
networks:
  resonance:
    driver: bridge