# ============================================================================
# Resonance Platform — Local Docker (No Gateway)
# ============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: resonance-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - resonance

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resonance-api
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT:-1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - resonance

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resonance-worker
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      APP_MODE: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_MAX_MEMORY_MB: ${WORKER_MAX_MEMORY_MB:-2048}
      WORKER_MAX_EXECUTION_MS: ${WORKER_MAX_EXECUTION_MS:-300000}
      WORKER_HEALTH_PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["worker"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - resonance

volumes:
  redis_data:
    driver: local

networks:
  resonance:
    driver: bridge